  <text
     x="640"
     y="343"
     text-anchor="middle"
     font-size="13px"
     fill="#1e6b4f"
     font-weight="bold"
     id="text14">risultato: TERMINA</text>
  <text
     x="640"
     y="385"
     text-anchor="middle"
     font-size="12px"
     fill="#555555"
     id="text15">✗ contraddice la previsione di H</text>
