  <title
     id="title1">Interferenza costruttiva e distruttiva</title>
  <desc
     id="desc1">Due onde sonore che si sommano: in fase producono un'onda più ampia (interferenza costruttiva), in opposizione di fase si annullano (interferenza distruttiva)</desc>
