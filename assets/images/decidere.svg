<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 382 312"
   font-family="Georgia, 'Times New Roman', serif"
   version="1.1"
   id="svg21"
   sodipodi:docname="01-riconoscere-vs-decidere-v2.svg"
   width="382"
   height="312"
   inkscape:version="1.4.4 (dcaf3e7, 2026-05-05)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs
     id="defs21" />
  <sodipodi:namedview
     id="namedview21"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="2.7266667"
     inkscape:cx="394.0709"
     inkscape:cy="195.66015"
     inkscape:window-width="2560"
     inkscape:window-height="1494"
     inkscape:window-x="-11"
     inkscape:window-y="-11"
     inkscape:window-maximized="1"
     inkscape:current-layer="svg21" />
  <rect
     x="-39"
     y="-59"
     width="900"
     height="400"
     fill="#fdfcf9"
     id="rect1" />
  <text
     x="411"
     y="-23"
     text-anchor="middle"
     font-size="20px"
     fill="#1e1e1e"
     font-weight="bold"
     id="text1">Semi-decidibile vs decidibile</text>
  <!-- Colonna 1: semi-decidibile -->
  <g
     transform="translate(1,1)"
     id="g11">
    <rect
       width="380"
       height="310"
       rx="12"
       fill="#ffffff"
       stroke="#1e1e1e"
       stroke-width="2"
       id="rect2"
       x="0"
       y="0" />
    <text
       x="190"
       y="36"
       text-anchor="middle"
       font-size="16px"
       fill="#a3742c"
       font-weight="bold"
       id="text2">Problema semi-decidibile</text>
    <text
       x="190"
       y="56"
       text-anchor="middle"
       font-size="12px"
       fill="#666666"
       font-style="italic"
       id="text3">es. simulazione diretta del codice</text>
    <rect
       x="25"
       y="80"
       width="330"
       height="75"
       rx="8"
       fill="#f0f6f3"
       stroke="#1e6b4f"
       stroke-width="1.5"
       id="rect3" />
    <text
       x="40"
       y="105"
       font-size="13px"
       fill="#1e6b4f"
       font-weight="bold"
       id="text4">Caso positivo — il programma termina</text>
    <text
       x="40"
       y="128"
       font-size="12px"
       fill="#333333"
       id="text5">si ferma e conferma la risposta in tempo finito</text>
    <text
       x="40"
       y="146"
       font-size="12px"
       fill="#1e6b4f"
       id="text6">✓ risposta &quot;sì&quot; garantita</text>
    <rect
       x="25"
       y="170"
       width="330"
       height="105"
       rx="8"
       fill="#fdf3f0"
       stroke="#a33f2c"
       stroke-width="1.5"
       id="rect6" />
    <text
       x="40"
       y="195"
       font-size="13px"
       fill="#a33f2c"
       font-weight="bold"
       id="text7">Caso negativo — il programma non termina</text>
    <text
       x="40"
       y="218"
       font-size="12px"
       fill="#333333"
       id="text8">resta in esecuzione senza mai fermarsi:</text>
    <text
       x="40"
       y="236"
       font-size="12px"
       fill="#333333"
       id="text9">non sappiamo mai se sta ancora calcolando</text>
    <text
       x="40"
       y="254"
       font-size="12px"
       fill="#333333"
       id="text10">o è bloccato per sempre</text>
    <text
       x="40"
       y="272"
       font-size="12px"
       fill="#a33f2c"
       id="text11">✗ nessuna risposta &quot;no&quot; in tempo finito</text>
  </g>
  <!-- Colonna 2: decidibile -->
  <g
     transform="translate(441,1)"
     id="g21">
    <rect
       width="380"
       height="310"
       rx="12"
       fill="#ffffff"
       stroke="#1e1e1e"
       stroke-width="2"
       id="rect11"
       x="0"
       y="0" />
    <text
       x="190"
       y="36"
       text-anchor="middle"
       font-size="16px"
       fill="#1e6b4f"
       font-weight="bold"
       id="text12">Problema decidibile</text>
    <text
       x="190"
       y="56"
       text-anchor="middle"
       font-size="12px"
       fill="#666666"
       font-style="italic"
       id="text13">es. riscrittura algebrica del codice</text>
    <rect
       x="25"
       y="80"
       width="330"
       height="75"
       rx="8"
       fill="#f0f6f3"
       stroke="#1e6b4f"
       stroke-width="1.5"
       id="rect13" />
    <text
       x="40"
       y="105"
       font-size="13px"
       fill="#1e6b4f"
       font-weight="bold"
       id="text14">Caso positivo</text>
    <text
       x="40"
       y="128"
       font-size="12px"
       fill="#333333"
       id="text15">la riscrittura mostra subito se il ciclo parte</text>
    <text
       x="40"
       y="146"
       font-size="12px"
       fill="#1e6b4f"
       id="text16">✓ risposta &quot;sì&quot; garantita, senza eseguire nulla</text>
    <rect
       x="25"
       y="170"
       width="330"
       height="105"
       rx="8"
       fill="#f0f6f3"
       stroke="#1e6b4f"
       stroke-width="1.5"
       id="rect16" />
    <text
       x="40"
       y="195"
       font-size="13px"
       fill="#1e6b4f"
       font-weight="bold"
       id="text17">Caso negativo</text>
    <text
       x="40"
       y="218"
       font-size="12px"
       fill="#333333"
       id="text18">la stessa riscrittura mostra altrettanto</text>
    <text
       x="40"
       y="236"
       font-size="12px"
       fill="#333333"
       id="text19">chiaramente quando il ciclo non partirà mai</text>
    <text
       x="40"
       y="254"
       font-size="12px"
       fill="#1e6b4f"
       id="text20">✓ risposta &quot;no&quot; garantita, senza eseguire nulla</text>
    <text
       x="40"
       y="272"
       font-size="12px"
       fill="#666666"
       font-style="italic"
       id="text21">l'algoritmo non entra mai in un ciclo incerto</text>
  </g>
</svg>
